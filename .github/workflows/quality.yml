name: Portfolio quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Configure PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install validation tooling
        run: npm ci --ignore-scripts

      - name: Validate source
        run: npm test

      - name: Smoke-test routes
        run: |
          php -S 127.0.0.1:8000 index.php > /tmp/portfolio-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          ready=false
          for attempt in {1..20}; do
            if curl --fail --silent "http://127.0.0.1:8000/" > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/portfolio-php.log
              exit 1
            fi
            sleep 0.5
          done

          if [ "$ready" != true ]; then
            cat /tmp/portfolio-php.log
            exit 1
          fi

          for route in / /about /skills /experiences /projects /contact /cv /mentions-legales /politique-confidentialite; do
            curl --fail --silent --show-error "http://127.0.0.1:8000${route}" > /dev/null
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/not-found)" = "404"
